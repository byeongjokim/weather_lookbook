<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="성수동 실시간 날씨 기반 24/7 series 룩북" />
    <title>24/7 series Weather Lookbook</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="screen-shell" aria-label="24/7 series weather lookbook">
      <section class="display-card">
        <header class="brand-header">
          <p class="eyebrow">WEATHER LOOKBOOK</p>
          <h1>24/7 series</h1>
          <p class="location">Seongsu-dong, Seoul</p>
        </header>

        <section class="weather-panel" aria-labelledby="weather-title">
          <div>
            <p class="section-label" id="weather-title">WEATHER</p>
            <div class="weather-main">
              <span class="weather-icon" id="weatherIcon" aria-hidden="true">☁</span>
              <div>
                <p class="today-label">오늘</p>
                <p class="temperature"><span id="temperature">--</span>°C</p>
              </div>
            </div>
          </div>
          <dl class="weather-meta">
            <div>
              <dt>습도</dt>
              <dd><span id="humidity">--</span>%</dd>
            </div>
            <div>
              <dt>강수</dt>
              <dd id="precipitation">확인 중</dd>
            </div>
            <div>
              <dt>업데이트</dt>
              <dd id="updatedAt">--:--</dd>
            </div>
          </dl>
        </section>

        <section class="lookbook-panel" aria-labelledby="lookbook-title">
          <div class="lookbook-copy">
            <p class="section-label" id="lookbook-title">TODAY'S LOOK</p>
            <h2 id="lookTitle">날씨에 맞는 룩을 고르는 중</h2>
            <p id="lookDescription">성수동의 기온, 습도, 눈/비 여부를 기준으로 룩북을 추천합니다.</p>
          </div>
          <figure class="lookbook-frame">
            <img id="lookbookImage" src="./assets/lookbook/default.svg" alt="24/7 series 기본 룩북 이미지" />
          </figure>
        </section>

        <nav class="service-strip" aria-label="24/7 series services">
          <div>
            <span aria-hidden="true">☂</span>
            <p>WEATHER<br />MATCH</p>
          </div>
          <div>
            <span aria-hidden="true">◇</span>
            <p>LOOKBOOK<br />CURATION</p>
          </div>
          <div>
            <span aria-hidden="true">♡</span>
            <p>COMFORT<br />DAILY</p>
          </div>
        </nav>

        <footer>
          <p>24시간 7일, 편안함을 입는다.</p>
          <small id="statusMessage">기상청 API 설정을 기다리는 중입니다.</small>
        </footer>
      </section>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
